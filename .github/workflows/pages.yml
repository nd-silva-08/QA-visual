# Publishes the live demo to GitHub Pages: the example report as the site's front page, with
# the launch video beside it.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - examples/refunds/report.html
      - docs/media/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Put the site together
        run: |
          mkdir -p _site
          cp examples/refunds/report.html _site/index.html
          cp docs/media/visual-qa.mp4 _site/visual-qa.mp4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
