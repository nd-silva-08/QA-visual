name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit and end-to-end tests
        run: npm test
      - name: Demo renders in headless Chrome
        run: |
          node skills/visual-qa/scripts/render.mjs skills/visual-qa/assets/example-spec.json \
            -o /tmp/demo.html --no-git --check
